<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, user-scalable=no" />
    <title>Archive Ocellus Trainer</title>
    <link rel="icon" href="data:," />
    <style>
      body {
        margin: 0;
        overflow: hidden;
        overscroll-behavior: none;
        background: black;
        color: white;
        font-family: sans-serif;
      }

      canvas {
        image-rendering: pixelated;
      }

      #hud_corner {
        position: absolute;
        bottom: 4px;
        left: 4px;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 4px;
        max-width: calc(100% - 8px);
        pointer-events: none;
      }

      #start_panel button,
      #paused_panel button {
        padding: 2px 8px;
        border: 1px solid #000;
        background: #5a5245;
        color: #ff981f;
        font: inherit;
        cursor: pointer;
      }

      #whats_new_panel,
      #start_panel,
      #paused_panel {
        border: 2px solid #000;
        outline: 1px solid #5a5245;
        background: #3e3529;
        color: #ff981f;
        text-shadow: 1px 1px 0 black;
      }

      #whats_new_panel[hidden] {
        display: none;
      }

      #whats_new_panel {
        position: absolute;
        bottom: calc(100% + 4px);
        left: 0;
        box-sizing: border-box;
        width: min(44ch, calc(100vw - 8px));
        max-height: calc(100vh - 145px);
        overflow-y: auto;
        padding: 8px 12px;
      }

      #whats_new_panel h2 {
        margin: 0 0 6px;
        font-size: 14px;
        color: #ffff00;
      }

      #whats_new_panel h3 {
        margin: 8px 0 4px;
        font-size: 12px;
      }

      #whats_new_panel ul {
        margin: 0 0 8px;
        padding-left: 16px;
        color: #fff;
      }

      #whats_new_panel li + li {
        margin-top: 4px;
      }

      #whats_new_close {
        position: sticky;
        bottom: 0;
      }

      .unseen_dot {
        display: inline-block;
        width: 6px;
        height: 6px;
        margin-left: 4px;
        border-radius: 50%;
        background: #ff0000;
        box-shadow: 0 0 0 1px #000;
        vertical-align: middle;
      }

      #start_panel,
      #paused_panel {
        position: absolute;
        top: 20%;
        left: 50%;
        transform: translateX(-50%);
        max-width: calc(100% - 32px);
        padding: 12px 16px;
        text-align: center;
        font-size: 14px;
      }

      #start_panel h2,
      #paused_panel h2 {
        margin: 0 0 6px;
        font-size: 18px;
        color: #ffff00;
      }

      #start_panel p,
      #paused_panel p {
        margin: 0 0 8px;
      }

      #game_chat {
        margin: 0;
        padding: 0;
        list-style: none;
        font-size: 14px;
        text-shadow: 1px 1px 0 black;
        pointer-events: none;
      }

      /* Fixed mode: black lines on the chatbox's parchment, as the client draws them. */
      #hud_corner.fixed_chatbox #game_chat {
        font-size: inherit;
        color: #000;
        text-shadow: none;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
