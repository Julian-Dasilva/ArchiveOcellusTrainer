name: Nightly

on:
  schedule:
    - cron: "23 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  perf-timing:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/netlify-cache
          key: osrs-cache-${{ hashFiles('scripts/netlify-build.sh', 'osrs-assets.config.ts', 'scripts/install-beta-sdk.sh') }}
          restore-keys: |
            osrs-cache-
      - name: Extract the assets and build, as the deploy does
        env:
          NETLIFY_CACHE_DIR: ${{ runner.temp }}/netlify-cache
        run: bash scripts/netlify-build.sh
      - run: npm install --global agent-browser@0.34.0 && agent-browser install && sudo apt-get install -y fonts-freefont-ttf
      - name: Time main against main a day earlier in throttled pairs
        env:
          VERIFY_DIR: ${{ runner.temp }}/verify
          AGENT_BROWSER_ARGS: --enable-unsafe-swiftshader
        run: VERIFY_PERF_BASE="$(git rev-list -1 --before='1 day ago' HEAD)" scripts/verify.sh perf
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf-timing-evidence
          path: |
            ${{ runner.temp }}/verify/summary.txt
            ${{ runner.temp }}/verify/perf-checks.json
            ${{ runner.temp }}/verify/perf/captures/
