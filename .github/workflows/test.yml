name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - run: scripts/install-beta-sdk.sh
      - run: npm run typecheck
      - run: scripts/check-types.test.sh
      - run: scripts/release-notes.test.sh
      - run: scripts/verify/verdicts.test.sh
      - run: scripts/verify/parity.test.sh
      - run: scripts/verify/t2.test.sh
      - run: scripts/install-beta-sdk.test.sh
      - run: review-ratchet/checks/shell-test-runs-entry.test.sh
      - run: node review-ratchet/checks/shell-test-runs-entry.mjs .
      - run: npm test
      - name: Replay the test changes over the base
        if: github.event_name == 'pull_request' || github.event.before != '0000000000000000000000000000000000000000'
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node review-ratchet/checks/replay-controls.mjs --base "$BASE"
      - run: scripts/netlify-build.test.sh
      - run: npm run build

  perf:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/netlify-cache
          key: osrs-cache-${{ hashFiles('scripts/netlify-build.sh') }}
      - name: Extract the assets and build, as the deploy does
        env:
          NETLIFY_CACHE_DIR: ${{ runner.temp }}/netlify-cache
        run: bash scripts/netlify-build.sh
      - run: npm install --global agent-browser@0.34.0 && agent-browser install && sudo apt-get install -y fonts-freefont-ttf
      - name: Measure the deterministic budgets, unthrottled
        env:
          VERIFY_PERF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          VERIFY_DIR: ${{ runner.temp }}/verify
          AGENT_BROWSER_ARGS: --enable-unsafe-swiftshader
        run: scripts/verify.sh perfbudgets
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf-evidence
          path: |
            ${{ runner.temp }}/verify/summary.txt
            ${{ runner.temp }}/verify/perf-checks.json
            ${{ runner.temp }}/verify/perf/captures/

  plan:
    runs-on: ubuntu-latest
    outputs:
      timing: ${{ steps.plan.outputs.timing }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - name: Plan the units this change needs
        id: plan
        env:
          VERIFY_PLAN_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          mkdir -p "$RUNNER_TEMP/plan"
          scripts/verify.sh plan --out "$RUNNER_TEMP/plan/plan.json" | tee "$RUNNER_TEMP/plan/plan.txt"
          echo "timing=$(node -e 'console.log(require(process.argv[1]).units.includes("perf_timing"))' "$RUNNER_TEMP/plan/plan.json")" >>"$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: t2-plan
          path: ${{ runner.temp }}/plan/

  perf-timing:
    needs: plan
    if: needs.plan.outputs.timing == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/netlify-cache
          key: osrs-cache-${{ hashFiles('scripts/netlify-build.sh') }}
      - name: Extract the assets and build, as the deploy does
        env:
          NETLIFY_CACHE_DIR: ${{ runner.temp }}/netlify-cache
        run: bash scripts/netlify-build.sh
      - run: npm install --global agent-browser@0.34.0 && agent-browser install && sudo apt-get install -y fonts-freefont-ttf
      - name: Time the head against the base in throttled pairs
        env:
          VERIFY_PERF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          VERIFY_DIR: ${{ runner.temp }}/verify
          AGENT_BROWSER_ARGS: --enable-unsafe-swiftshader
        run: scripts/verify.sh perf
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf-timing-evidence
          path: |
            ${{ runner.temp }}/verify/summary.txt
            ${{ runner.temp }}/verify/perf-checks.json
            ${{ runner.temp }}/verify/perf/captures/

  assets:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/netlify-cache
          key: osrs-cache-${{ hashFiles('scripts/netlify-build.sh') }}
      - name: Extract the head's assets and build, as the deploy does
        env:
          NETLIFY_CACHE_DIR: ${{ runner.temp }}/netlify-cache
        run: bash scripts/netlify-build.sh
      - name: Extract the base's assets
        if: github.event_name == 'pull_request' || github.event.before != '0000000000000000000000000000000000000000'
        env:
          NETLIFY_CACHE_DIR: ${{ runner.temp }}/netlify-cache
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: git worktree add --detach "$RUNNER_TEMP/base" "$BASE" && (cd "$RUNNER_TEMP/base" && bash scripts/netlify-build.sh)
      - name: Compare the bundles and record the SDK pin
        run: |
          mkdir -p "$RUNNER_TEMP/assets"
          scripts/install-beta-sdk.sh --check | tee "$RUNNER_TEMP/assets/sdk-pin.txt"
          cp public/osrs-assets/manifest.json "$RUNNER_TEMP/assets/manifest.json"
          if [[ -d "$RUNNER_TEMP/base/public/osrs-assets" ]]; then
            cp "$RUNNER_TEMP/base/public/osrs-assets/manifest.json" "$RUNNER_TEMP/assets/base-manifest.json"
            node scripts/verify/assets-diff.mjs "$RUNNER_TEMP/base/public/osrs-assets" public/osrs-assets | tee "$RUNNER_TEMP/assets/assets-diff.txt"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: t2-assets
          path: ${{ runner.temp }}/assets/

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/netlify-cache
          key: osrs-cache-${{ hashFiles('scripts/netlify-build.sh') }}
      - name: Extract the assets and build, as the deploy does
        env:
          NETLIFY_CACHE_DIR: ${{ runner.temp }}/netlify-cache
        run: bash scripts/netlify-build.sh
      - run: npm install --global agent-browser@0.34.0 && agent-browser install && sudo apt-get install -y fonts-freefont-ttf
      - name: Render WebGL with Mesa's llvmpipe on a virtual display
        run: |
          sudo apt-get install -y xvfb libgl1-mesa-dri
          Xvfb :99 -screen 0 1920x1080x24 &
      - name: Drive the shard's browser units
        env:
          VERIFY_DIR: ${{ runner.temp }}/verify
          DISPLAY: ":99"
          AGENT_BROWSER_HEADED: "1"
          AGENT_BROWSER_ARGS: --ignore-gpu-blocklist,--use-gl=angle,--use-angle=gl
        run: scripts/verify.sh browser --shard ${{ matrix.shard }}/8
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: t2-browser-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/verify/summary.txt
            ${{ runner.temp }}/verify/server.log
            ${{ runner.temp }}/verify/units/

  production:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/netlify-cache
          key: osrs-cache-${{ hashFiles('scripts/netlify-build.sh') }}
      - name: Extract the assets and build, as the deploy does
        env:
          NETLIFY_CACHE_DIR: ${{ runner.temp }}/netlify-cache
        run: bash scripts/netlify-build.sh
      - run: npm install --global agent-browser@0.34.0 && agent-browser install && sudo apt-get install -y fonts-freefont-ttf
      - name: Drive the production bundle
        env:
          VERIFY_DIR: ${{ runner.temp }}/verify
          AGENT_BROWSER_ARGS: --enable-unsafe-swiftshader
        run: scripts/verify.sh production
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: t2-production
          path: |
            ${{ runner.temp }}/verify/summary.txt
            ${{ runner.temp }}/verify/production*.json
            ${{ runner.temp }}/verify/production*.png

  summary:
    if: ${{ !cancelled() }}
    needs: [plan, assets, browser, production, perf, perf-timing]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/t2/artifacts
      - name: Judge every unit together and write the one verdict
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          T2="$RUNNER_TEMP/t2"
          mkdir -p "$T2/browser/units"
          for shard in "$T2"/artifacts/t2-browser-*/; do [[ ! -d "$shard/units" ]] || cp -R "$shard/units/." "$T2/browser/units/"; done
          scripts/verify.sh report "$T2/browser" | tee "$T2/browser.txt" || true
          node scripts/verify/t2-summary.mjs "$T2" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: t2-verdict
          path: |
            ${{ runner.temp }}/t2/verdict.json
            ${{ runner.temp }}/t2/browser.txt
            ${{ runner.temp }}/t2/browser/browser-checks.json
            ${{ runner.temp }}/t2/artifacts/t2-assets/
            ${{ runner.temp }}/t2/artifacts/perf-evidence/perf-checks.json
            ${{ runner.temp }}/t2/artifacts/perf-timing-evidence/perf-checks.json
            ${{ runner.temp }}/t2/artifacts/t2-plan/
            ${{ runner.temp }}/t2/artifacts/t2-production/
