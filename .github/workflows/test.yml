name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  actions: write
  pull-requests: write

concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - run: scripts/install-beta-sdk.sh
      - run: npm run typecheck
      - run: npm run check-types
      - run: scripts/check-types.test.sh
      - run: scripts/release-notes.test.sh
      - run: scripts/verify/verdicts.test.sh
      - run: scripts/verify/parity.test.sh
      - run: scripts/verify/parity-harness.test.sh
      - run: scripts/verify/t2.test.sh
      - run: scripts/verify/bundle.test.sh
      - run: scripts/verify/workers.test.sh
      - run: scripts/verify/affected-tests.test.sh
      - run: scripts/verify/pr-evidence.test.sh
      - run: scripts/verify/chrome.test.sh
      - run: scripts/verify/ci-verdict.test.sh
      - run: scripts/install-beta-sdk.test.sh
      - run: review-ratchet/checks/shell-test-runs-entry.test.sh
      - run: node review-ratchet/checks/shell-test-runs-entry.mjs .
      - run: npm test
      - name: Replay the test changes over the base
        if: github.event_name == 'pull_request' || github.event.before != '0000000000000000000000000000000000000000'
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node review-ratchet/checks/replay-controls.mjs --base "$BASE"
      - run: scripts/netlify-build.test.sh

  perf:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install the browser
        run: npm install --global agent-browser@0.34.0 && agent-browser install && sudo apt-get install -y fonts-freefont-ttf
      - name: Chrome launches
        env:
          AGENT_BROWSER_ARGS: --enable-unsafe-swiftshader
          VERIFY_DIR: ${{ runner.temp }}/chrome
        run: scripts/verify.sh chrome
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/netlify-cache
          key: osrs-cache-${{ hashFiles('scripts/netlify-build.sh') }}
      - name: Extract the assets and build, as the deploy does
        env:
          NETLIFY_CACHE_DIR: ${{ runner.temp }}/netlify-cache
        run: bash scripts/netlify-build.sh
      - name: Measure the deterministic budgets, unthrottled
        env:
          VERIFY_PERF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          VERIFY_DIR: ${{ runner.temp }}/verify
          AGENT_BROWSER_ARGS: --enable-unsafe-swiftshader
        run: scripts/verify.sh perfbudgets
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf-evidence
          path: |
            ${{ runner.temp }}/verify/summary.txt
            ${{ runner.temp }}/verify/perf-checks.json
            ${{ runner.temp }}/verify/perf/captures/

  plan:
    runs-on: ubuntu-latest
    outputs:
      timing: ${{ steps.plan.outputs.timing }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - name: Plan the units this change needs
        id: plan
        env:
          VERIFY_PLAN_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          mkdir -p "$RUNNER_TEMP/plan"
          scripts/verify.sh plan --out "$RUNNER_TEMP/plan/plan.json" | tee "$RUNNER_TEMP/plan/plan.txt"
          echo "timing=$(node -e 'console.log(require(process.argv[1]).units.includes("perf_timing"))' "$RUNNER_TEMP/plan/plan.json")" >>"$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: t2-plan
          path: ${{ runner.temp }}/plan/

  perf-timing:
    needs: plan
    if: needs.plan.outputs.timing == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install the browser
        run: npm install --global agent-browser@0.34.0 && agent-browser install && sudo apt-get install -y fonts-freefont-ttf
      - name: Chrome launches
        env:
          AGENT_BROWSER_ARGS: --enable-unsafe-swiftshader
          VERIFY_DIR: ${{ runner.temp }}/chrome
        run: scripts/verify.sh chrome
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/netlify-cache
          key: osrs-cache-${{ hashFiles('scripts/netlify-build.sh') }}
      - name: Extract the assets and build, as the deploy does
        env:
          NETLIFY_CACHE_DIR: ${{ runner.temp }}/netlify-cache
        run: bash scripts/netlify-build.sh
      - name: Time the head against the base in throttled pairs
        env:
          VERIFY_PERF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          VERIFY_DIR: ${{ runner.temp }}/verify
          AGENT_BROWSER_ARGS: --enable-unsafe-swiftshader
        run: scripts/verify.sh perf
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf-timing-evidence
          path: |
            ${{ runner.temp }}/verify/summary.txt
            ${{ runner.temp }}/verify/perf-checks.json
            ${{ runner.temp }}/verify/perf/captures/

  assets:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/netlify-cache
          key: osrs-cache-${{ hashFiles('scripts/netlify-build.sh') }}
      - name: Extract the head's assets and build, as the deploy does
        env:
          NETLIFY_CACHE_DIR: ${{ runner.temp }}/netlify-cache
        run: bash scripts/netlify-build.sh
      - name: Extract the base's assets
        if: github.event_name == 'pull_request' || github.event.before != '0000000000000000000000000000000000000000'
        env:
          NETLIFY_CACHE_DIR: ${{ runner.temp }}/netlify-cache
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: git worktree add --detach "$RUNNER_TEMP/base" "$BASE" && (cd "$RUNNER_TEMP/base" && bash scripts/netlify-build.sh)
      - name: Compare the bundles and record the SDK pin
        run: |
          mkdir -p "$RUNNER_TEMP/assets"
          scripts/install-beta-sdk.sh --check | tee "$RUNNER_TEMP/assets/sdk-pin.txt"
          cp public/osrs-assets/manifest.json "$RUNNER_TEMP/assets/manifest.json"
          if [[ -d "$RUNNER_TEMP/base/public/osrs-assets" ]]; then
            cp "$RUNNER_TEMP/base/public/osrs-assets/manifest.json" "$RUNNER_TEMP/assets/base-manifest.json"
            node scripts/verify/assets-diff.mjs "$RUNNER_TEMP/base/public/osrs-assets" public/osrs-assets | tee "$RUNNER_TEMP/assets/assets-diff.txt"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: t2-assets
          path: ${{ runner.temp }}/assets/

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v4
      - name: Install the browser
        run: npm install --global agent-browser@0.34.0 && agent-browser install && sudo apt-get install -y fonts-freefont-ttf
      - name: Chrome launches
        env:
          AGENT_BROWSER_ARGS: --enable-unsafe-swiftshader
          VERIFY_DIR: ${{ runner.temp }}/chrome
        run: scripts/verify.sh chrome
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/netlify-cache
          key: osrs-cache-${{ hashFiles('scripts/netlify-build.sh') }}
      - name: Extract the assets and build, as the deploy does
        env:
          NETLIFY_CACHE_DIR: ${{ runner.temp }}/netlify-cache
        run: bash scripts/netlify-build.sh
      - name: Render WebGL with Mesa's llvmpipe on a virtual display
        run: |
          sudo apt-get install -y xvfb libgl1-mesa-dri
          Xvfb :99 -screen 0 1920x1080x24 &
      - name: Drive the shard's browser units
        env:
          VERIFY_DIR: ${{ runner.temp }}/verify
          DISPLAY: ":99"
          AGENT_BROWSER_HEADED: "1"
          AGENT_BROWSER_ARGS: --ignore-gpu-blocklist,--use-gl=angle,--use-angle=gl,--enable-precise-memory-info
        run: scripts/verify.sh browser --shard ${{ matrix.shard }}/8
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: t2-browser-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/verify/summary.txt
            ${{ runner.temp }}/verify/server.log
            ${{ runner.temp }}/verify/units/

  production:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install the browser
        run: npm install --global agent-browser@0.34.0 && agent-browser install && sudo apt-get install -y fonts-freefont-ttf
      - name: Chrome launches
        env:
          AGENT_BROWSER_ARGS: --enable-unsafe-swiftshader
          VERIFY_DIR: ${{ runner.temp }}/chrome
        run: scripts/verify.sh chrome
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/netlify-cache
          key: osrs-cache-${{ hashFiles('scripts/netlify-build.sh') }}
      - name: Extract the assets and build, as the deploy does
        env:
          NETLIFY_CACHE_DIR: ${{ runner.temp }}/netlify-cache
        run: bash scripts/netlify-build.sh
      - name: Drive the production bundle
        env:
          VERIFY_DIR: ${{ runner.temp }}/verify
          AGENT_BROWSER_ARGS: --enable-unsafe-swiftshader
        run: scripts/verify.sh production
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: t2-production
          path: |
            ${{ runner.temp }}/verify/summary.txt
            ${{ runner.temp }}/verify/production*.json
            ${{ runner.temp }}/verify/production*.png

  release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/netlify-cache
          key: osrs-cache-${{ hashFiles('scripts/netlify-build.sh') }}
      - name: Install the cache the release build reads
        env:
          NETLIFY_CACHE_DIR: ${{ runner.temp }}/netlify-cache
        run: bash scripts/netlify-build.sh
      - name: Build with scripts/release-build.sh and check the bundle
        env:
          NETLIFY_CACHE_DIR: ${{ runner.temp }}/netlify-cache
        run: scripts/release-build.sh
      - run: npm install --global agent-browser@0.34.0 && agent-browser install && sudo apt-get install -y fonts-freefont-ttf
      - name: Open the release bundle on a desktop and a phone
        env:
          AGENT_BROWSER_ARGS: --enable-unsafe-swiftshader
          RELEASE_PORT: 8765
        run: scripts/release-browser.sh

  chrome:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install the browser
        run: npm install --global agent-browser@0.34.0 && agent-browser install
      - name: Chrome launches
        env:
          AGENT_BROWSER_ARGS: --enable-unsafe-swiftshader
          VERIFY_DIR: ${{ runner.temp }}/chrome
        run: scripts/verify.sh chrome

  evidence:
    if: github.event_name == 'pull_request'
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: t2-plan
          path: ${{ runner.temp }}/plan
      - name: The pull request records its proof
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr view ${{ github.event.pull_request.number }} --json body --jq .body > "$RUNNER_TEMP/body.md"
          node scripts/verify/pr-evidence.mjs "$RUNNER_TEMP/plan/plan.json" "$RUNNER_TEMP/body.md"

  summary:
    if: ${{ !cancelled() }}
    needs: [plan, assets, browser, production, perf, perf-timing, release, chrome, evidence]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/t2/artifacts
      - name: Judge every unit together and write the one verdict
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          CHROME_RESULT: ${{ needs.chrome.result }}
          EVIDENCE_RESULT: ${{ needs.evidence.result }}
          RELEASE_RESULT: ${{ needs.release.result }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          T2="$RUNNER_TEMP/t2"
          mkdir -p "$T2/browser/units"
          for shard in "$T2"/artifacts/t2-browser-*/; do [[ ! -d "$shard/units" ]] || cp -R "$shard/units/." "$T2/browser/units/"; done
          scripts/verify.sh report "$T2/browser" | tee "$T2/browser.txt" || true
          verdict=0
          node scripts/verify/t2-summary.mjs "$T2" >"$T2/verdict.md" || verdict=$?
          printf -- '- chrome: %s\n- evidence: %s\n- release: %s\n' "$CHROME_RESULT" "$EVIDENCE_RESULT" "$RELEASE_RESULT" >>"$T2/verdict.md"
          if [[ "$CHROME_RESULT" == failure || "$EVIDENCE_RESULT" == failure || "$RELEASE_RESULT" != success ]]; then
            verdict=1
          fi
          if [[ "$verdict" -ne 0 ]]; then
            sed -i 's/^## T2 PASS/## T2 FAIL/' "$T2/verdict.md"
          fi
          if [[ -f "$T2/verdict.json" ]]; then
            node -e '
              const fs = require("fs");
              const file = process.argv[1];
              const verdict = JSON.parse(fs.readFileSync(file, "utf8"));
              verdict.chrome = process.argv[2];
              verdict.evidence = process.argv[3];
              verdict.release = process.argv[4];
              if (process.argv[5] !== "0") verdict.passed = false;
              fs.writeFileSync(file, JSON.stringify(verdict, null, 2) + "\n");
            ' "$T2/verdict.json" "$CHROME_RESULT" "$EVIDENCE_RESULT" "$RELEASE_RESULT" "$verdict"
          fi
          cat "$T2/verdict.md" | tee -a "$GITHUB_STEP_SUMMARY"
          if [[ -n "${PR_NUMBER}" ]]; then
            {
              echo '<!-- t2-verdict -->'
              cat "$T2/verdict.md"
              echo
              echo '### Job times'
            } >"$T2/comment.md"
            if gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs?per_page=100" --jq '.jobs[] | [.name, (.conclusion // .status), .started_at, .completed_at] | @tsv' >"$T2/jobs.tsv"; then
              node scripts/verify/job-times.mjs "$T2/jobs.tsv" >>"$T2/comment.md"
            else
              echo 'job times unavailable' >>"$T2/comment.md"
            fi
            node -e 'const fs = require("fs"); process.stdout.write(JSON.stringify({ body: fs.readFileSync(process.argv[1], "utf8") }))' "$T2/comment.md" >"$T2/payload.json"
            gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" --jq '.[] | select(.body | contains("<!-- t2-verdict -->")) | .id' >"$T2/comment-ids.txt" || true
            existing="$(head -n 1 "$T2/comment-ids.txt")"
            if [[ -n "$existing" ]]; then
              gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${existing}" --input "$T2/payload.json" || echo "could not update the pull request comment"
            else
              gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" --input "$T2/payload.json" || echo "could not update the pull request comment"
            fi
          fi
          exit "$verdict"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: t2-verdict
          path: |
            ${{ runner.temp }}/t2/verdict.json
            ${{ runner.temp }}/t2/verdict.md
            ${{ runner.temp }}/t2/browser.txt
            ${{ runner.temp }}/t2/browser/browser-checks.json
            ${{ runner.temp }}/t2/artifacts/t2-assets/
            ${{ runner.temp }}/t2/artifacts/perf-evidence/perf-checks.json
            ${{ runner.temp }}/t2/artifacts/perf-timing-evidence/perf-checks.json
            ${{ runner.temp }}/t2/artifacts/t2-plan/
            ${{ runner.temp }}/t2/artifacts/t2-production/
